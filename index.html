<body>
  <div class="app-shell">
    <header class="statusbar" aria-label="Your learning status">
      <button class="track-picker" data-action="languages" aria-haspopup="dialog" aria-label="Choose a language">
        <span class="track-picker-icon" id="track-icon" aria-hidden="true">&lt;/&gt;</span>
        <span class="track-picker-copy"><small>LANGUAGE</small><b id="active-track">HTML</b></span>
        <span class="picker-chevron" aria-hidden="true">⌄</span>
      </button>
      <div class="status-metrics">
        <button class="status-metric streak-metric" data-action="streak" aria-label="Open streak celebration"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13.1 2.8c.5 3.8-2.7 4.8-2.5 7.8-1.2-.8-1.7-2-1.5-3.6C6.7 9.2 5 12 5 14.7a7 7 0 0 0 14 0c0-4.4-2.3-8.4-5.9-11.9Zm-1.2 17a3.1 3.1 0 0 1-3.1-3.1c0-1.2.7-2.4 1.6-3.1.1 1.3.9 2 1.5 2.4.7-1.1 1.2-1.8 1.2-3.2a5.8 5.8 0 0 1 1.9 4 3.1 3.1 0 0 1-3.1 3Z"/></svg></span><b id="streak-top">0</b><small>streak</small></button>
        <div class="status-metric xp-metric"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7l9-5Zm0 3.1L6 8.4v7.2l6 3.3 6-3.3V8.4l-6-3.3Zm0 2.1 4.4 2.4v5L12 17l-4.4-2.4v-5L12 7.2Z"/></svg></span><b id="xp-top">0</b><small>Love XP</small></div>
        <button class="theme-toggle" data-action="theme" aria-label="Switch theme" title="Switch theme"><span aria-hidden="true">☾</span></button>
      </div>
    </header>
    <main id="main" class="main-content" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-view="path" aria-label="Path" aria-current="page"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V8l8-5 8 5v11h-6v-6h-4v6H4Zm2-2h2v-6h8v6h2V9.1l-6-3.7-6 3.7V17Z"/></svg></span><span>Path</span></button>
      <button data-view="sandbox" aria-label="Sandbox"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8.2 5.4 1.4 1.4L5.4 11l4.2 4.2-1.4 1.4L2.6 11l5.6-5.6Zm7.6 0 5.6 5.6-5.6 5.6-1.4-1.4 4.2-4.2-4.2-4.2 1.4-1.4ZM13.5 3l-4 18h2.1l4-18h-2.1Z"/></svg></span><span>Sandbox</span></button>
      <button data-view="notes" aria-label="Love Notes"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5-8.5-11A4.5 4.5 0 0 1 12 7.3 4.5 4.5 0 0 1 20.5 10C20.5 16 12 21 12 21Zm0-2.4c2.2-1.4 6.5-4.8 6.5-8.6a2.5 2.5 0 0 0-4.8-1.1h-3.4A2.5 2.5 0 0 0 5.5 10c0 3.8 4.3 7.2 6.5 8.6Z"/></svg></span><span>Notes</span></button>
      <button data-view="vibes" aria-label="Vibes"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 2a8 8 0 0 1 6.3 3.1l-3.4.3-2.5-2.1-.4-1.3Zm-6.6 3 1.8.7.4 2.2-1.2 1.7-1.8-.2A7.8 7.8 0 0 1 5.4 7Zm3.4 12.5-1.4-2.1.8-2.1 2.3-.8 1.7 1.1.2 2.8-2.3 1.5c-.5-.1-.9-.2-1.3-.4Zm9.5-2.3-1.2-2.4 1.1-2 2.5-.7A7.8 7.8 0 0 1 18.3 17.2Z"/></svg></span><span>Vibes</span></button>
      <button class="mobile-nav-extra" data-action="streak" aria-label="Challenges"><span class="nav-icon" aria-hidden="true">🏆</span><span>Challenges</span></button>
      <button data-view="me" aria-label="Profile"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.4 0-8 2.5-8 5.5V22h16v-2.5c0-3-3.6-5.5-8-5.5Z"/></svg></span><span>Me</span></button>
